# A rapidly spinning supermassive black hole with a thin, hot accretion disk (Novikov-Thorne),
# in true colour: every annulus is a blackbody, seen through Doppler boosting (the approaching side
# is bluer and far brighter), gravitational redshift and light bending (the far side of the disk is
# lifted over the top, the n = 1 photon ring hugs the shadow).

[shot]
name = 04_quasar_disk
duration = 22
fps = 30
fade_in = 1.0
fade_out = 1.5

[bh]
spin = 0.99
mass_msun = 1e8
distance_mpc = 100

[render]
mode = visible
tolerance = 1e-9
spp = 8
spp_max = 96
target_error = 0.03
r_escape = 5e4

[disk]
enabled = 1
r_out = 32
t_max = 24000
turbulence = 0.55
turbulence_scale = 0.28
correlation_orbits = 0.7
limb_darkening = 1

[flow]
enabled = 0

[sky]
enabled = 1
file = data/sky/sky.bhsk
l_deg = 60
b_deg = 10
brightness = 1

[camera]
r = 160
incl = 79
phi = 0
fov_deg = 22
motion = orbit
width = 3840
height = 2160

[post]
bloom = 0.07
exposure_percentile = 0.995
exposure_key = 0.85
vignette = 0.22
grain = 0.005

[hud]
style = visible
title = A feeding supermassive black hole
lines = 100 million solar masses, spin 0.99, thin accretion disk at up to 24,000 K | visible light, true colours (Doppler + gravitational shifts)
note = the far side of the disk is bent over the top; the thin bright n = 1 ring is light that circled the hole

[track]
camera.r = 0:160, 15:30, 22:24
camera.fov_deg = 0:20, 15:44, 22:52
camera.phi = 0:0, 22:-70
camera.incl = 0:79, 22:85
time.t_m = 0:0, 22:600
