# Dive into the photon ring. Light arriving near the critical curve has circled the hole: the
# n-th sub-ring is an image of the whole flow, exponentially thinner (by the Lyapunov factor
# e^-gamma ~ 1/20 here) and delayed by about one orbit (~30 M = 11 days for M87*) per order.
# Midway the direct (n = 0) light is removed -- the standard sub-image decomposition of
# photon-ring studies -- and each pixel is tinted by the orbit count of its light.
include = base_m87.ini

[render]
tolerance = 1e-11
spp_max = 128
max_steps = 60000

[shot]
name = 02_photon_ring_zoom
duration = 22
fps = 30
fade_in = 0.8
fade_out = 1.2

[camera]
target_psi_deg = -100      # on the bright southern side of the ring
target_offset_m = 0.0

[post]
exposure_smooth = 3
exposure_percentile = 0.995
exposure_key = 0.6

[hud]
style = zoom

[track]
camera.zoom = 0:1, 2:1, 6:8, 19:40000, 22:40000
camera.target = 0:0, 2:0, 6:1
time.t_m = 0:420, 22:452
post.hide_direct = 0:0, 6:0, 8:1
post.overlay = 0:0, 6.5:0, 8.5:0.8, 20:0.8, 21.5:0.3
