# Dive into the photon ring: each sub-ring is light that circled the hole one more time, and is
# exponentially thinner (by the Lyapunov factor) than the one outside it.
include = base_m87.ini

[render]
tolerance = 1e-11
spp_max = 128
max_steps = 60000

[shot]
name = 02_photon_ring_zoom
duration = 20
fps = 30
fade_in = 0.8
fade_out = 1.2

[camera]
target_psi_deg = -100      # on the bright southern side of the ring
target_offset_m = 0.0

[post]
exposure_smooth = 2
exposure_percentile = 0.99

[hud]
style = zoom

[track]
camera.zoom = 0:1, 2:1, 17:30000, 20:30000
camera.target = 0:0, 2:0, 6.5:1
time.t_m = 0:420, 20:450
post.overlay = 0:0, 10:0, 12:0.85, 17.5:0.85, 19:0.0
