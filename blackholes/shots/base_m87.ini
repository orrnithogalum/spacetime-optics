# M87*: 6.5e9 solar masses at 16.8 Mpc (EHT 2019), spin 0.94, viewed 17 deg from the spin axis with
# the spin pointing away from us (the flow turns clockwise on the sky), jet position angle 288 deg.
# The hot accretion flow is a RIAF (thermal relativistic electrons, synchrotron emission and
# self-absorption at 230 GHz) whose density is normalised to the observed 0.6 Jy.

[bh]
spin = 0.94
mass_msun = 6.5e9
distance_mpc = 16.8

[render]
mode = radio
tolerance = 1e-9
spp = 8
spp_max = 96
target_error = 0.03
r_escape = 2000
step_fraction = 0.04

[flow]
nu_ghz = 230
flux_jy = 0.6
theta0 = 30              # kT_e / m_e c^2 at r = 1 M
theta_index = 0.84
n_index = 1.1
h_over_r = 0.35
beta = 10
r_max = 60
keplerian_fraction = 0.9
turbulence = 0.8
turbulence_scale = 0.45
correlation_orbits = 0.6
normalize_fov_m = 40

[camera]
r = 1e7                  # effectively at infinity (exact geodesics all the way)
incl = 163
phi = 0
roll = 108
fov_m = 30               # image width in gravitational radii (~115 microarcseconds)
width = 3840
height = 2160

[post]
colormap = afmhot
beam_uas = 20
exposure_percentile = 0.995
exposure_key = 0.95
vignette = 0.12
grain = 0.004

[hud]
style = radio
title = M87*  /  230 GHz
lines = 6.5 billion solar masses, 55 million light-years away | simulated: Kerr black hole, spin 0.94, hot accretion flow, 17 deg inclination
note = colour: specific intensity, linear (Event Horizon Telescope palette)
