# A quiet stellar black hole (33 solar masses, like Gaia BH3) in front of the real Milky Way:
# 1.7 billion Gaia DR2 / Hipparcos / Tycho stars. The camera falls in from 3000 M on a circular-orbit
# velocity profile (relativistic aberration and Doppler shift of the sky included). Near the shadow
# the entire sky is imaged again and again -- the photon ring of the celestial sphere.

[shot]
name = 03_gaia_bh3
duration = 20
fps = 30
fade_in = 1.0
fade_out = 1.2

[bh]
spin = 0.5
mass_msun = 33
distance_pc = 590

[render]
mode = visible
tolerance = 1e-9
spp = 8
spp_max = 64
target_error = 0.04
r_escape = 5e4

[disk]
enabled = 0

[flow]
enabled = 0

[sky]
enabled = 1
file = data/sky/sky.bhsk
l_deg = 2              # the galactic centre and the dark lanes of Sagittarius behind the hole
b_deg = -2
roll_deg = 0
brightness = 1

[camera]
r = 3000
incl = 72
phi = 0
fov_deg = 18
motion = orbit
width = 3840
height = 2160

[post]
bloom = 0.035
exposure_percentile = 0.997
exposure_key = 1.05
vignette = 0.22
grain = 0.006

[hud]
style = visible
title = A quiet black hole in front of the Milky Way
lines = 33 solar masses, spin 0.5 (like Gaia BH3), no accretion | visible light, true colours: 1.7 billion Gaia stars
note = near the shadow every star appears again and again in ever thinner rings: the photon ring of the sky

[track]
camera.r = 0:3000, 12:26, 20:13
camera.fov_deg = 0:14, 12:62, 20:84
camera.phi = 0:0, 20:-45
camera.incl = 0:72, 20:84
camera.yaw = 0:0, 12:6, 20:9
