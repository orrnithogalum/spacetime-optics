# A Sun-like star 10 pc behind Earth. Its disk (0.93 mas) is comparable to Earth's Einstein
# ring, so beyond the focal distance the star's whole photosphere -- limb darkening, granulation,
# spots -- is wrapped into a thick, blinding ring around the night-side silhouette of Earth.
# The star's surface is ~10^5 times brighter than sunlit Earth: exposed for the ring, Earth is a
# black disk, exactly like the Moon during an annular solar eclipse.

[time]
utc = 2026-03-20T12:00:00

[target]
name = Sun-like star (G2V)
type = star
ra = 12:00:00
dec = +30:00:00
distance_pc = 10
radius_rsun = 1.0
teff = 5772
granulation = 0.14
granule_km = 1300
spots = 4
spot_scale = 1.4
pole_tilt_deg = 25
seed = 3

[earth]
textures = data/earth
turbulence = 0.03

[camera]
width = 1920
height = 1080
spp = 16
spp_max = 256
fov = auto
exposure = auto
exposure_percentile = 0.95

[sweep]
mode = sweep
d_min_au = 6000
d_max_au = 120000
d_steps = 240

[output]
dir = out/sunlike_10pc
