# Grid of telescope positions for the interactive viewer: 240 distances (log-spaced along the
# focal line) x 7 lateral offsets across it. Scrub distance with the mouse wheel / arrow keys,
# the offset with up/down. A second, diffraction-limited view through a 6 km synthetic aperture
# (lambda/D ~ 20 microarcseconds) is rendered alongside the ideal one.
include = proxima_b.ini

[telescope]
aperture_m = 6000
obstruction = 0.10
spiders = 4

[sweep]
mode = sweep
d_min_au = 4000
d_max_au = 80000
d_steps = 240
lat_steps = 7
lat_max_km = 1800
lat_angle_deg = 25

[output]
dir = out/proxima_b_explorer
