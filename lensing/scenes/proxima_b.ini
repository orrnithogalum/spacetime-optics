# A telescope on Earth's gravitational focal line, looking back at Earth while the planet
# Proxima Centauri b sits exactly behind it. The planet is imaged into an Einstein ring around
# Earth once the telescope is beyond the focal distance (~16,000 AU).

[time]
# Epoch at which the imaged light grazes Earth (the telescope sees it ~90 days later).
# Chosen so the telescope looks down on a sunlit Europe / Arctic in late spring.
utc = 2026-05-20T09:37:00

[target]
name = Proxima Centauri b
type = planet
ra = 14:29:42.95            # J2000
dec = -62:40:46.1
distance_pc = 1.3012
radius_km = 7160            # ~1.12 Earth radii (assumed: only m sin i is measured)
surface = procedural        # procedural | earth (re-use Earth's textures as an "Earth twin")
phase_deg = 60              # star - planet - Earth angle
phase_pa_deg = 120          # direction of the host star on the sky
host_teff = 3042
host_radius_rsun = 0.1542
orbit_au = 0.04857
show_host = 1
cloud_cover = 0.55
ocean_level = 0.02
seed = 11

[earth]
textures = data/earth
atmosphere = 1
clouds = 1
night_lights = 1
relief = 1.0
ocean_wind = 7              # m/s, sets the width of the sun glint
aod550 = 0.08               # aerosol optical depth
ozone_du = 300
turbulence = 0.03           # gravity-wave density perturbations in the upper atmosphere
airglow = 1

[gravity]
j2 = 1                      # Earth's oblateness (astroid caustic)
solar_tide = 1              # differential deflection by the Sun across the lens

[camera]
width = 1920
height = 1080
spp = 16                    # first pass samples / pixel
spp_max = 256               # adaptive refinement cap
target_error = 0.02
fov = auto                  # or a full width in milliarcseconds
fov_margin = 1.35
exposure = auto             # or the luminance (cd/m^2) mapped to near-white
exposure_percentile = 0.995
exposure_key = 0.85
exposure_smooth = 6         # frames (gaussian sigma) along the sweep
white_balance = sun
hud = 1

[telescope]
aperture_m = 0              # > 0 adds a diffraction-limited "telescope" view
obstruction = 0.12
spiders = 4
spider_width = 0.012
noise = 0
exposure_s = 1

[sweep]
mode = sweep                # sweep | path | still
d_min_au = 4000
d_max_au = 80000
d_steps = 240
lat_max_km = 0
lat_steps = 1

[output]
dir = out/proxima_b
exr = 0
