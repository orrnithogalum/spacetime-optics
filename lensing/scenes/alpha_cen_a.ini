# Alpha Centauri A, 1.34 pc: its disk (8.5 mas) is far larger than Earth's Einstein ring, so the
# telescope sees Earth's dark disk in front of a seething photosphere; lensing shows up as the
# granulation being magnified and stretched into arcs near the Einstein radius.

[time]
utc = 2026-05-20T09:37:00

[target]
name = Alpha Centauri A
type = star
ra = 14:39:36.49
dec = -60:50:02.4
distance_pc = 1.3384
radius_rsun = 1.2234
teff = 5790
granulation = 0.15
granule_km = 1500
spots = 6
seed = 21

[earth]
textures = data/earth

[camera]
width = 1920
height = 1080
fov = auto
exposure = auto
exposure_percentile = 0.9

[sweep]
mode = sweep
d_min_au = 6000
d_max_au = 120000
d_steps = 240

[output]
dir = out/alpha_cen_a
