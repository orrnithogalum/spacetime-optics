# Cinematic flight along the focal line (for a video): start well inside the focal distance,
# watch the ring peel off Earth's limb, slide sideways off the axis so the ring breaks into two
# arcs (the planet's image moves off the caustic), come back, and recede to 80,000 AU.
# Earth turns at 1.5 h per second of film (time-lapse).
include = proxima_b.ini

[camera]
width = 3840
height = 2160
spp = 16
spp_max = 512
exposure_smooth = 10

[sweep]
mode = path
fps = 30
hours_per_second = 1.5
#           t[s]  D[AU]   x[km]  y[km]
keyframes = 0     3000    0      0    ; \
            9     15500   0      0    ; \
            15    30000   0      0    ; \
            18    30000   0      0    ; \
            25    30000   1600   500  ; \
            28    30000   1600   500  ; \
            34    30000   0      0    ; \
            44    90000   0      0

[output]
dir = out/proxima_b_cinematic
